[project]
name = "burn-eval"
version = "1.0.0"
description = "Measures Burn's catch rate, false positives, latency, scale and cost."
requires-python = ">=3.12"
dependencies = ["burn-contracts", "burn-detect", "httpx>=0.27", "boto3>=1.35"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.uv.sources]
burn-contracts = { path = "../contracts", editable = true }
burn-detect = { path = "../detection", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
