[project]
name = "burn-detect"
version = "1.0.0"
description = "Credential detection and outbound containment for Burn."
requires-python = ">=3.12"
dependencies = ["burn-contracts"]

[project.optional-dependencies]
proxy = ["boto3>=1.35", "mitmproxy>=11,<13"]
leaktest = ["boto3>=1.35", "fastapi>=0.115", "uvicorn>=0.32", "httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
burn-contracts = { path = "../contracts", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["burn_detect", "proxy", "sink", "leaktest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
