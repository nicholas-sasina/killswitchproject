[project]
name = "burn-cli"
version = "1.0.0"
description = "Command-line client for the Burn API."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
burn = "burn_cli.main:run"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["burn_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
