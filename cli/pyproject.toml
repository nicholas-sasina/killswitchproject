[project]
name = "burn-cli"
version = "1.0.0"
description = "Command-line client for the Burn API."
requires-python = ">=3.12"
dependencies = ["pyyaml>=6", "jsonschema>=4", "burn-contracts"]

[project.scripts]
burn = "burn_cli.main:run"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv.sources]
burn-contracts = { path = "../contracts", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["burn_cli", "burn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
