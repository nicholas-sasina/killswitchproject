[project]
name = "burn-minter"
version = "1.0.0"
description = "Credential minter Lambda, mock API provider, and their tests."
requires-python = ">=3.12"
dependencies = ["boto3", "burn-contracts"]

[dependency-groups]
dev = ["pytest", "moto[dynamodb,iam,secretsmanager,ssm]>=5", "pyyaml"]

[tool.uv]
package = false

[tool.uv.sources]
burn-contracts = { path = "../contracts", editable = true }

[tool.pytest.ini_options]
pythonpath = ["lambdas/minter", "lambdas/provider", "scripts"]
testpaths = ["tests"]
