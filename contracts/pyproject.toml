[project]
name = "burn-contracts"
version = "1.0.0"
description = "Shared, stdlib-only helpers that implement the Burn contracts (event ids, events, fingerprints, names)."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest", "jsonschema", "pyyaml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/burn_contracts"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]
