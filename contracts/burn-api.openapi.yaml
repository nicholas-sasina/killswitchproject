openapi: 3.0.3
info:
  title: Burn API
  version: 1.0.0
  description: |
    Public API used by the dashboard, the scenario runner and the eval harness.
    Real implementation: API Gateway HTTP API + Lambda (/burn_api). Mock: /mocks/burn_api_mock.py.

    Who may call what, once people sign-in is switched on for a stack (`BURN_PEOPLE_AUTH=1` on the API).
    Until then the admin header (`x-burn-demo-token`) works as before on every route, alongside the
    instance credentials below.
    - People sign in to the people user pool (invite-only) and send their ID token as
      `Authorization: Bearer <jwt>` (`personBearer`). It is required on every route except the exempt
      ones below; a missing or invalid token is a 401.
    - The exempt routes are exactly `POST /instances`, `POST /instances/{session_id}/heartbeat`,
      `POST /instances/{session_id}/exit` and the CORS `OPTIONS` preflight. They carry their own credential, which
      the API checks itself: a join token in the body for a join (`joinToken`), or the instance's own session token,
      `Authorization: Bearer bst_...` (`instanceBearer`), for its heartbeat, exit and spawning a child.
    - Every form of `POST /sessions` now needs a person. Instance clients (joining and spawning) use
      `POST /instances`.
    - `x-burn-demo-token` (`adminHeader`) is then for local development only: the API ignores it unless it
      also runs with `BURN_LOCAL_DEV=1`, which a deployment never sets.
    The mock server accepts any token and adds the response header `x-burn-mock: true`
    so the dashboard can show a MOCK banner.

    Internal (not an HTTP route): the mock API provider hands a canary incident to the
    `burn-api` Lambda by direct async invoke (`names.BURN_API_FUNCTION`), with the event
    `{"canary_incident": {"secret_ref": "burn/agent-x/canary_...", "event_id": "evt_..."}}`.
    The Lambda re-reads attribution from burn-credentials (it never trusts the payload) and
    contains only the canary's own session: conditional revoke (active -> revoked), then
    rotation of the agent's credentials only if no other active session uses them.
servers:
  - url: http://localhost:8700
    description: mock server (development only)
security:
  - personBearer: []
  - adminHeader: []
paths:
  /sessions:
    post:
      summary: Start an agent session (one instance). Issues a badge and the instance's credentials.
      security:
        - personBearer: []
        - adminHeader: []    # local development only
      description: |
        Every form needs a signed-in person; instance clients use `POST /instances` for the two role forms.
        Three forms:
        - `{agent_id}`: a scenario agent (a role with one instance, fixed agent id). Unchanged.
        - `{role, enroll_token}`: a new instance of a role, joining with a join token.
        - `{role, parent_session}`: a child spawned by a running instance. The role must be in the
          parent role's `may_spawn`; the child never gets more tools, credentials or egress than its parent.
        A role-based instance gets its own agent id `agent-<role>-<6 hex>`, so its credentials,
        ledger and burn are its own. The session_id is the instance's identity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [agent_id]
                  properties:
                    agent_id: { $ref: '#/components/schemas/AgentId' }
                - type: object
                  required: [role, enroll_token]
                  properties:
                    role: { $ref: '#/components/schemas/RoleName' }
                    enroll_token: { type: string, description: 'bjt_<token_id>.<secret>' }
                - type: object
                  required: [role, parent_session]
                  properties:
                    role: { $ref: '#/components/schemas/RoleName' }
                    parent_session: { type: string }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '201':
          description: Session started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionStarted' }
        '403': { description: join token invalid, expired, used up or revoked; or role not in the parent's may_spawn }
        '404': { description: agent_id is not in the loaded scenario, or the role or parent session does not exist }
        '429': { description: rate limited while issuing credentials; retry with backoff }
  /burn:
    post:
      summary: Burn an agent. Revoke badge, rotate its own credentials, flag others it saw, start blast radius.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id]
              properties:
                agent_id: { $ref: '#/components/schemas/AgentId' }
                reason: { type: string, maxLength: 200 }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Burn completed (blast radius is fetched separately)
          content:
            application/json:
              schema:
                type: object
                required: [agent_id, revoked, sessions_revoked, rotated, flagged]
                properties:
                  agent_id: { $ref: '#/components/schemas/AgentId' }
                  revoked: { type: boolean }
                  sessions_revoked: { type: array, items: { type: string } }
                  rotated:
                    type: array
                    description: secret_refs owned by this agent that were rotated.
                    items: { type: string }
                  flagged:
                    type: array
                    description: secret_refs in this agent's ledger owned by someone else (shared or another agent). Not rotated, flagged for review.
                    items: { type: string }
        '404': { description: unknown agent }
  /burn/{agent_id}/blast-radius:
    get:
      summary: CloudTrail activity of the agent's AWS keys (current and previous versions).
      parameters:
        - { name: agent_id, in: path, required: true, schema: { $ref: '#/components/schemas/AgentId' } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Blast radius
          content:
            application/json:
              schema:
                type: object
                required: [agent_id, keys, events]
                properties:
                  agent_id: { $ref: '#/components/schemas/AgentId' }
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        key_ref: { type: string, example: 'burn/agent-reader/aws_key#v1' }
                        key_hint: { type: string, description: 'last 4 chars of the access key id', example: '…Q7XA' }
                        status: { type: string, enum: [active, inactive] }
                  events:
                    type: array
                    items:
                      type: object
                      required: [ts, key_ref, event_name]
                      properties:
                        ts: { type: string, format: date-time }
                        key_ref: { type: string }
                        event_name: { type: string, example: ListBuckets }
                        event_source: { type: string, example: s3.amazonaws.com }
                        resource: { type: string, nullable: true }
                        source_ip: { type: string, nullable: true }
                        error_code: { type: string, nullable: true }
                  note:
                    type: string
                    example: CloudTrail event history can lag 5-15 minutes behind real activity.
  /badge/{session_id}:
    get:
      summary: Badge status for one session.
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: string } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Badge status
          content:
            application/json:
              schema:
                type: object
                required: [session_id, agent_id, status]
                properties:
                  session_id: { type: string }
                  agent_id: { $ref: '#/components/schemas/AgentId' }
                  status: { type: string, enum: [active, revoked, exited], description: exited = the instance ended cleanly or went inactive; refused like revoked }
        '404': { description: unknown session }
  /events:
    get:
      summary: Dashboard feed. Polled once per second.
      parameters:
        - name: since
          in: query
          required: false
          description: Return events with event_id strictly greater than this. Omit for the latest 200.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 200, maximum: 500 }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Events in ascending event_id order, plus current agent states.
          content:
            application/json:
              schema:
                type: object
                required: [events, agents]
                properties:
                  events:
                    type: array
                    items: { $ref: 'ledger-event.schema.json' }
                  agents:
                    type: array
                    items: { $ref: '#/components/schemas/AgentState' }
                  cursor:
                    type: string
                    nullable: true
                    description: event_id of the last event returned; pass as `since` next time.
  /agents/{agent_id}/ledger:
    get:
      summary: The agent's exposure ledger (credentials it has seen). Fingerprints only.
      parameters:
        - { name: agent_id, in: path, required: true, schema: { $ref: '#/components/schemas/AgentId' } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Ledger entries
          content:
            application/json:
              schema:
                type: object
                required: [agent_id, entries]
                properties:
                  agent_id: { $ref: '#/components/schemas/AgentId' }
                  entries:
                    type: array
                    items: { $ref: '#/components/schemas/LedgerEntry' }
  /roles:
    get:
      summary: List roles (burn.yaml, dashboard and scenario agents).
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Roles
          content:
            application/json:
              schema:
                type: object
                required: [roles]
                properties:
                  roles: { type: array, items: { $ref: '#/components/schemas/Role' } }
    post:
      summary: Create a role.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleSpec' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Role' } } } }
        '409': { description: a role with this name exists }
  /roles/{name}:
    get:
      summary: One role.
      parameters:
        - { name: name, in: path, required: true, schema: { $ref: '#/components/schemas/RoleName' } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200': { description: Role, content: { application/json: { schema: { $ref: '#/components/schemas/Role' } } } }
        '404': { description: no such role }
    put:
      summary: Create or replace a role (used by `burn apply`).
      description: A role managed_by `code` can only be changed through this route with managed_by `code`; the dashboard shows it read-only. Scenario roles cannot be changed here.
      parameters:
        - { name: name, in: path, required: true, schema: { $ref: '#/components/schemas/RoleName' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleSpec' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/Role' } } } }
        '409': { description: the role is managed elsewhere (managed_by differs) }
  /roles/{name}/tokens:
    post:
      summary: Create a join token for a role. The token is returned once; only its hash is stored.
      parameters:
        - { name: name, in: path, required: true, schema: { $ref: '#/components/schemas/RoleName' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                uses: { type: integer, minimum: 1, maximum: 10000, default: 1 }
                ttl: { type: integer, minimum: 60, maximum: 2592000, default: 3600, description: seconds }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '201':
          description: Token created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnrollToken'
                  - type: object
                    required: [token]
                    properties:
                      token: { type: string, description: 'bjt_<token_id>.<secret>. Shown once.' }
        '404': { description: no such role }
  /tokens/{token_id}:
    delete:
      summary: Revoke a join token. Instances that already joined keep running (burn them with scope token).
      parameters:
        - { name: token_id, in: path, required: true, schema: { type: string } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200': { description: Revoked, content: { application/json: { schema: { $ref: '#/components/schemas/EnrollToken' } } } }
        '404': { description: no such token }
  /instances:
    get:
      summary: List instances (one per session).
      parameters:
        - { name: role, in: query, required: false, schema: { $ref: '#/components/schemas/RoleName' } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [active, revoked, exited] } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Instances, newest first
          content:
            application/json:
              schema:
                type: object
                required: [instances]
                properties:
                  instances: { type: array, items: { $ref: '#/components/schemas/Instance' } }
    post:
      summary: Start a role instance (join or spawn). The same two role forms as POST /sessions.
      security:
        - instanceBearer: [] # {role, parent_session}: the parent's session token
        - joinToken: []      # {role, enroll_token}: the join token in the body
        - adminHeader: []    # local development only
      description: |
        A path of its own for the two role forms, so an authorizer in front of the API can decide by
        method and path alone: these two requests carry their own authority (the join token, or the
        parent's session token), while every other route needs a person or the admin token.
        - `{role, enroll_token}`: a new instance of a role, joining with a join token. No auth header.
        - `{role, parent_session}`: a child spawned by a running instance, with
          `Authorization: Bearer <the parent's session_token>`. The role must be in the parent role's
          `may_spawn`; the child never gets more tools, credentials or egress than its parent.
        The reply is the same as for the role forms of `POST /sessions` (secrets included, once).
        Without the admin token, any other body shape is refused with 401. `POST /sessions` keeps working unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [role, enroll_token]
                  additionalProperties: false
                  properties:
                    role: { $ref: '#/components/schemas/RoleName' }
                    enroll_token: { type: string, description: 'bjt_<token_id>.<secret>' }
                - type: object
                  required: [role, parent_session]
                  additionalProperties: false
                  properties:
                    role: { $ref: '#/components/schemas/RoleName' }
                    parent_session: { type: string }
      responses:
        '201':
          description: Instance started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionStarted' }
        '400': { description: "with the admin token: a body that is not one of the two role forms, or both enroll_token and parent_session" }
        '401': { description: no valid authority for this body (a malformed, mixed or unknown shape, or a wrong or missing session token) }
        '403': { description: join token invalid, expired, used up or revoked; or role not in the parent's may_spawn; or the parent is not active }
        '404': { description: the role or parent session does not exist }
        '429': { description: rate limited while issuing credentials; retry with backoff }
  /instances/{session_id}/heartbeat:
    post:
      summary: Mark an instance as alive (sent by `burn run` while the agent makes calls).
      description: |
        The body may carry task progress the agent reported to its supervisor since the last heartbeat
        (`progress`, oldest first). Burn stamps each event with its own receive time, on Burn's clock, so an
        agent cannot backdate anything, and keeps one entry per item on the instance:
        `{"started_at": <ts>, "done_at": <ts or null>}`.
        - `done` for an item that was never started counts as started and done at the same time.
        - A repeated `started` keeps the first `started_at`; a repeated `done` keeps the first `done_at`.
        - Only item ids are stored. Reads return counts (`items_started`, `items_done`), never the map.
        A broken rule is a 400 naming the rule, and nothing from that heartbeat is recorded. It is never a 409,
        so a supervisor cannot mistake it for its instance being burned.
      security: [{ instanceBearer: [] }, { adminHeader: [] }]   # the session token of this instance
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Heartbeat' }
      responses:
        '400': { description: "a progress rule was broken: a bad item id or state, more than 50 events in one heartbeat, or more than 500 distinct items for this instance" }
        '401': { description: no valid session token for this instance }
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Instance' } } } }
        '404': { description: no such session }
        '409': { description: the instance is not active (burned or exited) }
  /instances/{session_id}/exit:
    post:
      summary: Clean exit. Revokes the instance's badge and deletes its own credentials.
      security: [{ instanceBearer: [] }, { adminHeader: [] }]   # the session token of this instance
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: string } }
      responses:
        '401': { description: no valid session token for this instance }
        '200': { description: Exited, content: { application/json: { schema: { $ref: '#/components/schemas/Instance' } } } }
        '404': { description: no such session }
  /instances/{session_id}:
    get:
      summary: One instance, as GET /instances lists it (a launcher reads it when its instance stops).
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: string } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200': { description: The instance, content: { application/json: { schema: { $ref: '#/components/schemas/Instance' } } } }
        '404': { description: no such session }
  /instances/{session_id}/replace:
    post:
      summary: Link a fresh instance as the replacement of a burned one.
      description: |
        Called by whatever started the burned instance (for example `make swarm`), after it joined a fresh
        instance of the same role the normal way. The path names the burned instance; the body names the new one.
        Burn never starts the replacement itself and never stores the task: the launcher keeps it, so a
        compromised agent cannot rewrite it. The reply tells the launcher which items to skip (`done`) and which
        to leave for a person (`quarantined`); it hands both to the new instance as `BURN_RESUME`.
        The old instance's `replacement` must be `pending`. One TransactWriteItems updates both rows on
        conditions (old: pending -> linked and `replaced_by`; new: `replaces` and `generation`), so exactly one
        replacement is ever linked to a burned instance, however many launchers race. Writes a `replaced` event
        on the old instance and a `resumed` event on the new one.
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: string }, description: the burned instance }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id]
              additionalProperties: false
              properties:
                session_id: { type: string, description: the fresh instance that takes over the task }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Linked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReplaceResult' }
        '400': { description: "the new instance is not one that may replace it: it must be of the same role, active, created after the old one was burned, and not already a replacement (nor the old instance itself)" }
        '404': { description: no such session (the burned one) }
        '409': { description: "the old instance's replacement is not pending: it was already linked, it was never marked (not burned, a role burn, or a role without replace_on_burn), or it needs a person" }
  /burns:
    post:
      summary: Burn a set of instances at once.
      description: |
        Scopes: `instance` (one session), `role` (every active instance of a role), `lineage`
        (an instance and all its descendants), `token` (every instance that joined with a token;
        the token is revoked too). Every target session is revoked first, then each instance is
        burned exactly like `POST /burn`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, id]
              properties:
                scope: { type: string, enum: [instance, role, lineage, token] }
                id: { type: string, description: 'session_id, role name or token_id' }
                reason: { type: string, maxLength: 200 }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Burned
          content:
            application/json:
              schema:
                type: object
                required: [scope, id, burned]
                properties:
                  scope: { type: string }
                  id: { type: string }
                  burned:
                    type: array
                    description: One entry per instance, same shape as the POST /burn response.
                    items: { type: object }
                  failed:
                    type: array
                    items:
                      type: object
                      properties:
                        agent_id: { type: string }
                        error: { type: string }
        '404': { description: nothing matches the scope and id }
  /burn/by-source:
    post:
      summary: Burn every instance that read a source since a time, and every instance they messaged afterwards.
      description: |
        Finds instances (running or exited) that read the source since `since`, whether or not it held a
        credential (the Gateway writes a read row for every tool call that names a resource), plus the
        instances those sent messages to afterwards (handoff rows), and burns each through the
        scoped-burn path (`POST /burns`, scope instance). Running instances are revoked first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_ref]
              properties:
                tool: { type: string, description: 'optional: tool name, if source_ref is only the resource id' }
                source_ref:
                  type: string
                  maxLength: 4096
                  example: 'read_ticket:T-1001'
                  description: >-
                    As recorded on ledger rows ('<tool>:<resource>'), or with `tool`, the resource itself.
                    A resource that is not printable, longer than 200 characters or starts with 'sha256:'
                    is recorded as '<tool>:sha256:<hex sha-256 of the resource>'; sending the resource with
                    `tool` finds it either way.
                since: { type: string, format: date-time, description: 'default: all time' }
                reason: { type: string, maxLength: 200 }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Burned
          content:
            application/json:
              schema:
                type: object
                required: [source_ref, readers, burned]
                properties:
                  source_ref: { type: string }
                  since: { type: string, nullable: true }
                  readers:
                    type: array
                    items:
                      type: object
                      properties:
                        agent_id: { type: string }
                        via: { type: string, enum: [read, handoff] }
                        first_seen: { type: string, format: date-time }
                  burned:
                    type: array
                    description: One entry per instance, same shape as the POST /burn response.
                    items: { type: object }
                  failed:
                    type: array
                    items:
                      type: object
                      properties:
                        agent_id: { type: string }
                        error: { type: string }
        '404': { description: nobody read that source in the window }
  /flags:
    get:
      summary: Flagged credentials awaiting (or after) owner review, highest level first.
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Flags
          content:
            application/json:
              schema:
                type: object
                required: [flags]
                properties:
                  flags: { type: array, items: { $ref: '#/components/schemas/Flag' } }
  /flags/resolve:
    post:
      summary: Owner decision on one flag - rotate the credential or dismiss the flag, with a reason.
      description: |
        A later event at a HIGHER level than the level at dismissal reopens a dismissed flag;
        same-or-lower evidence only updates the instance count. Writes a `rotated` or `dismissed` event.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlagResolution' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: The flag after the decision (after rotate, the new version has no flag)
          content:
            application/json:
              schema:
                type: object
                properties:
                  flag: { $ref: '#/components/schemas/Flag' }
                  rotated_to_version: { type: integer, nullable: true }
        '404': { description: not a flagged credential }
components:
  responses:
    Unauthorized:
      description: No valid credential for this route (a missing or invalid person bearer token).
  securitySchemes:
    personBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The signed-in person's ID token from the people user pool (invite-only). Covers every route except the instance routes.
    instanceBearer:
      type: http
      scheme: bearer
      description: A role instance's own session token (bst_...), returned once in its join reply. For its heartbeat and exit, and for spawning a child with {role, parent_session}.
    joinToken:
      type: apiKey
      in: query
      name: enroll_token
      x-in-body: true
      description: A join token (bjt_...) carried in the JSON request body as `enroll_token`, with `role` and nothing else. OpenAPI cannot express a body credential, so this scheme documents it.
    adminHeader:
      type: apiKey
      in: header
      name: x-burn-demo-token
      description: Local development only (BURN_LOCAL_DEV=1) once people sign-in is switched on for a stack (BURN_PEOPLE_AUTH=1); a deployed API then ignores this header. Until then it works as before.
  schemas:
    CreatedBy:
      type: string
      nullable: true
      description: The signed-in person's email who caused this, or null for rows created before sign-in (or by an instance without a person). Not the same as `owner`, which stays the team named in burn.yaml.
    SessionStarted:
      description: The reply that starts a session or an instance (POST /sessions, POST /instances).
      type: object
      required: [session_id, agent_id, badge_ref, credentials]
      properties:
        session_id: { type: string }
        agent_id: { $ref: '#/components/schemas/AgentId' }
        badge_ref:
          type: string
          description: Secrets Manager name holding the badge (OAuth client id/secret, token URL, scope).
          example: burn/agent-reader/badge
        credentials:
          type: array
          items: { $ref: '#/components/schemas/CredentialRef' }
        role: { $ref: '#/components/schemas/RoleName' }
        parent_session: { type: string, nullable: true }
        token_id: { type: string, nullable: true }
        created_by: { $ref: '#/components/schemas/CreatedBy' }
        tools: { type: array, items: { type: string } }
        egress: { type: array, items: { type: string }, nullable: true }
        secrets:
          type: object
          required: [badge, session_token]
          description: |
            The instance's own secret values, returned ONLY when a role instance starts
            (`enroll_token` or `parent_session`); the scenario `agent_id` form never returns it.
            Returned once: Burn never sends these values again. The caller hands them to the
            instance and must not log or store them. The join token is the authority to receive them.
          properties:
            badge:
              type: object
              required: [client_id, client_secret, token_url, scope]
              properties:
                client_id: { type: string }
                client_secret: { type: string }
                token_url: { type: string }
                scope: { type: string }
            session_token:
              type: string
              pattern: '^bst_[A-Za-z0-9_-]{43}$'
              description: |
                Authenticates this instance's own calls as `Authorization: Bearer <session_token>`,
                in place of the admin token: its heartbeat and exit, and POST /sessions or
                POST /instances {role, parent_session} to spawn a child of it. Only its sha256 is stored. The
                supervisor keeps it and never hands it to the agent process.
            api_key: { type: string, description: Present if the role mints an api_key. }
            aws_key:
              type: object
              description: Present if the role mints an aws_key.
              required: [access_key_id, secret_access_key]
              properties:
                access_key_id: { type: string }
                secret_access_key: { type: string }
    Flag:
      type: object
      description: One flag per credential. Never contains a credential value.
      required: [secret_ref, flag_level, instance_count, state]
      properties:
        secret_ref: { type: string, example: burn/shared/crm_db_url }
        secret_type: { type: string, enum: [aws_key, api_key, other] }
        owner_agent_id: { type: string, description: '"shared", or the agent that owns the credential' }
        flag_level: { type: string, enum: [seen, attempted, reported], description: highest level reached; never decreases }
        instance_count: { type: integer, description: distinct instances (agent ids) whose evidence flagged it }
        state: { type: string, enum: [open, dismissed, rotated], description: 'open until an owner decides. rotated is only returned by /flags/resolve: the new credential version starts with no flag, so GET /flags no longer lists it' }
        flagged_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        evidence:
          type: object
          description: The first evidence that reached each level (safe ids only).
          properties:
            seen: { type: object }
            attempted: { type: object }
            reported: { type: object }
        resolution:
          type: object
          nullable: true
          description: The latest owner decision.
          properties:
            action: { type: string, enum: [rotate, dismiss] }
            reason: { type: string }
            by: { type: string, nullable: true }
            at: { type: string, format: date-time }
            level: { type: string, enum: [seen, attempted, reported], description: level when the owner decided }
    FlagResolution:
      type: object
      required: [secret_ref, action, reason]
      additionalProperties: false
      properties:
        secret_ref: { type: string }
        action:
          type: string
          enum: [rotate, dismiss]
          description: 'rotate = mint a new value now (agents read it through placeholders) and clear the flag; dismiss = keep the value, close the flag'
        reason: { type: string, minLength: 3, maxLength: 300, description: 'Shown in the event feed. Refused if it contains a registered credential.' }
        by: { type: string, pattern: '^[A-Za-z0-9 ._@-]{1,64}$', description: who decided }
    AgentId:
      type: string
      pattern: '^agent-[a-z0-9-]{1,40}$'
      example: agent-reader
    CredentialRef:
      type: object
      required: [secret_ref, type]
      properties:
        secret_ref: { type: string, example: burn/agent-reader/api_key }
        type: { type: string, enum: [aws_key, api_key, other] }
        owner: { type: string, enum: [agent, shared] }
        version: { type: integer, example: 1 }
        expires_at: { type: string, format: date-time, nullable: true }
    AgentState:
      type: object
      required: [agent_id, status]
      properties:
        agent_id: { $ref: '#/components/schemas/AgentId' }
        role: { type: string, nullable: true, example: reader }
        status: { type: string, enum: [active, revoked, idle], description: 'idle = in scenario, no active session' }
        session_id: { type: string, nullable: true }
        exposures: { type: integer, description: number of ledger entries }
    LedgerEntry:
      type: object
      required: [secret_ref, fingerprint, secret_type, owner, source, first_seen, status]
      properties:
        secret_ref: { type: string, nullable: true }
        fingerprint: { type: string }
        secret_type: { type: string, enum: [aws_key, api_key, other] }
        owner: { type: string, enum: [agent, shared, unknown] }
        owner_agent_id: { type: string, nullable: true }
        source: { type: string, enum: [tool_response, handoff] }
        via: { type: string, nullable: true, description: 'tool name, or sender agent_id for handoff' }
        first_seen: { type: string, format: date-time }
        status: { type: string, enum: [active, rotated, flagged], description: 'status of the credential itself' }
        flag_level: { type: string, enum: [seen, attempted, reported], nullable: true, description: 'review level when status = flagged (seen < attempted < reported, never decreases)' }
        exposure:
          type: string
          enum: [seen, referenced]
          default: seen
          description: 'seen = the plaintext reached the agent; referenced = it only ever got {{burn:ref:...}}. A burn never flags a credential whose exposures are all referenced.'
        source_ref: { type: string, nullable: true, description: "what the agent read it from: '<tool>:<resource>' (e.g. read_ticket:T-1001), '<tool>:sha256:<hex>' for a resource that is not printable, longer than 200 characters or starts with 'sha256:', or the tool alone" }
    RoleName:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{0,31}$'
      description: "`eval` and `eval-*` are reserved for the eval harness (its load-test agents are agent-eval-*); creating a role with such a name is a 400."
      example: worker
    RoleFields:
      type: object
      required: [name, tools]
      properties:
        name: { $ref: '#/components/schemas/RoleName' }
        tools: { type: array, items: { type: string }, description: MCP tools the instances may call }
        credentials:
          type: array
          items: { type: string, enum: [api_key, aws_key] }
          description: Own credentials minted for each instance.
        may_message: { type: array, items: { $ref: '#/components/schemas/RoleName' }, default: [] }
        may_spawn: { type: array, items: { $ref: '#/components/schemas/RoleName' }, default: [] }
        egress:
          type: array
          items: { type: string }
          nullable: true
          description: "Allowed outbound hosts for this role's instances. Null = the default allowlist. Burn's own Gateway is never blocked by it, since the Gateway already checks tools per role; every other destination, model endpoints included, must be listed."
        owner: { type: string, nullable: true, description: team or person responsible }
        canaries: { type: boolean, default: true, description: "Give each instance its own canary (a decoy key that never authenticates)." }
        auto_burn:
          type: boolean
          default: true
          description: "Burn an instance automatically when its canary is used from outside Burn. false = report-only: alert and flag, never burn."
        references:
          type: string
          enum: [replace, report, off]
          default: replace
          description: "Credentials Burn recognizes in tool output: replace = the agent gets {{burn:ref:<secret_ref>}} instead; report = record only; off = neither. Canaries are never replaced."
        replace_on_burn:
          type: boolean
          default: false
          description: "Start a clean replacement when one of this role's instances is burned (not when the whole role is burned)."
    RoleSpec:
      description: Request body for creating or saving a role.
      allOf:
        - $ref: '#/components/schemas/RoleFields'
        - type: object
          properties:
            managed_by: { type: string, enum: [code, ui], default: ui }
    Role:
      allOf:
        - $ref: '#/components/schemas/RoleFields'
        - type: object
          required: [managed_by]
          properties:
            managed_by: { type: string, enum: [code, ui, scenario], description: 'code = burn.yaml (read-only in the dashboard), ui = dashboard, scenario = scenario file' }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            active_instances: { type: integer }
    EnrollToken:
      type: object
      required: [token_id, role, uses, uses_left, expires_at, status]
      properties:
        token_id: { type: string, example: 3f9a0c1d2e4b5a6c }
        role: { $ref: '#/components/schemas/RoleName' }
        uses: { type: integer }
        uses_left: { type: integer }
        expires_at: { type: string, format: date-time }
        status: { type: string, enum: [active, used_up, expired, revoked] }
        created_at: { type: string, format: date-time }
        created_by: { $ref: '#/components/schemas/CreatedBy' }
    ItemId:
      type: string
      pattern: '^[A-Za-z0-9_.:-]{1,64}$'
      description: One item of an instance's task, named by whatever launched it (names.ITEM_ID_RE).
      example: w01-item-03
    ProgressEvent:
      type: object
      required: [item, state]
      additionalProperties: false
      properties:
        item: { $ref: '#/components/schemas/ItemId' }
        state: { type: string, enum: [started, done] }
    Heartbeat:
      type: object
      additionalProperties: false
      properties:
        progress:
          type: array
          maxItems: 50
          description: Progress the agent reported since the last heartbeat, oldest first.
          items: { $ref: '#/components/schemas/ProgressEvent' }
    Instance:
      type: object
      required: [session_id, agent_id, role, status, created_at]
      properties:
        session_id: { type: string }
        agent_id: { $ref: '#/components/schemas/AgentId' }
        role: { $ref: '#/components/schemas/RoleName' }
        status: { type: string, enum: [active, revoked, exited] }
        parent_session: { type: string, nullable: true }
        token_id: { type: string, nullable: true }
        owner: { type: string, nullable: true }
        created_by: { $ref: '#/components/schemas/CreatedBy' }
        tools: { type: array, items: { type: string } }
        egress: { type: array, items: { type: string }, nullable: true }
        created_at: { type: string, format: date-time }
        last_seen: { type: string, format: date-time, nullable: true }
        exited_at: { type: string, format: date-time, nullable: true }
        exposures: { type: integer, description: number of ledger entries }
        generation:
          type: integer
          minimum: 0
          default: 0
          description: 0 for an instance that is not a replacement; a replacement is its predecessor's generation + 1.
        replaces: { type: string, nullable: true, description: the burned instance (session_id) this one replaced }
        replaced_by: { type: string, nullable: true, description: the instance (session_id) that replaced this burned one }
        replacement:
          allOf: [{ $ref: '#/components/schemas/Replacement' }]
          nullable: true
          description: Set when this one instance was burned (scope instance, which burns by source and canary burns use too) and its role has replace_on_burn. A role, lineage or token burn never sets it.
        items_started: { type: integer, description: task items this instance reported started, finished ones included }
        items_done: { type: integer, description: task items this instance reported done }
    Replacement:
      type: object
      description: |
        What a replacement may resume, decided when the instance was burned. Only item ids and Burn's own times.
        An item counts as `done` only if it was done before `cutoff`. Anything started but not done before it (in
        flight at the breach), or touched at or after it, is `quarantined`: a possibly compromised agent worked on
        it, so it is left for a person and never retried automatically. Items never started are in neither list;
        the replacement does them from the task its launcher holds.
      required: [status, cutoff, cutoff_source, done, quarantined]
      properties:
        status:
          type: string
          enum: [pending, linked, needs_person]
          description: "pending = waiting for its launcher to link a fresh instance; linked = replaced (see replaced_by); needs_person = not replaced automatically because the instance was already a third-generation replacement (names.MAX_REPLACEMENT_GENERATION)"
        cutoff:
          type: string
          format: date-time
          description: The clean cut-off on Burn's clock, the earliest evidence of compromise for this instance.
        cutoff_source:
          type: string
          enum: [evidence, burn_time]
          description: "evidence = the time of the event that caused the burn (a blocked outbound credential, a canary use, a refused call) or of this instance's first read of the poisoned source for a burn by source; burn_time = no evidence time was known (a manual burn), so the burn time is used"
        done: { type: array, items: { $ref: '#/components/schemas/ItemId' } }
        quarantined: { type: array, items: { $ref: '#/components/schemas/ItemId' } }
    ReplaceResult:
      type: object
      required: [replaces, session_id, generation, cutoff, cutoff_source, done, quarantined]
      properties:
        replaces: { type: string, description: the burned instance }
        session_id: { type: string, description: the replacement }
        generation: { type: integer }
        cutoff: { type: string, format: date-time }
        cutoff_source: { type: string, enum: [evidence, burn_time] }
        done: { type: array, items: { $ref: '#/components/schemas/ItemId' }, description: skip these }
        quarantined: { type: array, items: { $ref: '#/components/schemas/ItemId' }, description: leave these for a person }
