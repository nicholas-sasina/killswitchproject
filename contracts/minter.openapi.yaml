openapi: 3.0.3
info:
  title: Burn credential minter (internal)
  version: 1.0.0
  description: |
    Internal API. Called by the Burn API and by the scenario loader, never by agents.

    Transport: direct Lambda invoke of the `burn-minter` function (no HTTP endpoint), with an
    HTTP-shaped event so it could sit behind API Gateway later without code changes:

        request  -> {"method": "POST", "path": "/agents/agent-reader/credentials", "body": {...}}
        response <- {"statusCode": 200, "body": {...}}

    Mock: /mocks/minter_mock.py (same function signature, in-memory).

    The minter is the only component that writes credential VALUES (to Secrets Manager).
    It registers fingerprints for every value it creates (see contracts/README.md#fingerprints).
paths:
  /agents/{agent_id}/credentials:
    post:
      summary: Issue the agent's own credentials. Idempotent - existing active credentials are returned, not re-minted.
      parameters:
        - { name: agent_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [types]
              properties:
                types:
                  type: array
                  items: { type: string, enum: [aws_key, api_key] }
                  example: [api_key, aws_key]
      responses:
        '200':
          description: Credentials (references only, never values)
          content:
            application/json:
              schema:
                type: object
                required: [credentials]
                properties:
                  credentials:
                    type: array
                    items:
                      type: object
                      required: [secret_ref, type, owner, version]
                      properties:
                        secret_ref: { type: string, example: burn/agent-reader/api_key }
                        type: { type: string, enum: [aws_key, api_key] }
                        owner: { type: string, enum: [agent] }
                        version: { type: integer }
                        expires_at: { type: string, format: date-time, nullable: true }
    delete:
      summary: Delete all of the agent's credentials (demo reset / teardown).
      parameters:
        - { name: agent_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: array, items: { type: string } }
  /agents/{agent_id}/rotate:
    post:
      summary: Rotate every credential the agent owns; flag the other credentials it was exposed to.
      parameters:
        - { name: agent_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                exposed_refs:
                  type: array
                  description: secret_refs from the agent's ledger (the Burn API passes these in).
                  items: { type: string }
                evidence:
                  type: object
                  description: Optional safe ids of what caused the burn (event_id, session_id). The minter sets source=burn and agent_id itself.
                  additionalProperties: false
                  properties:
                    event_id: { type: string, pattern: '^evt_[0-9A-HJKMNP-TV-Z]{26}$' }
                    session_id: { type: string, pattern: '^[A-Za-z0-9_.:-]{1,128}$' }
      responses:
        '200':
          description: Rotation result. Canaries the agent owns are never rotated (they never authenticate).
          content:
            application/json:
              schema:
                type: object
                required: [rotated, flagged]
                properties:
                  rotated: { type: array, items: { type: string } }
                  flagged: { type: array, items: { type: string } }
                  flag_levels:
                    type: object
                    description: Optional. Review level of each flagged secret_ref after this call.
                    additionalProperties: { $ref: '#/components/schemas/FlagLevel' }
  /agents/{agent_id}/key-activity:
    get:
      summary: CloudTrail history of the agent's AWS keys (current and previous), for the blast-radius view.
      description: |
        Direct-invoke event: {"method": "GET", "path": "/agents/agent-x/key-activity",
        "query": {"since": "2026-11-07T20:00:00Z"}}. `since` is optional.
        Never returns full access key ids or secret values, only the last 4 characters.
        CloudTrail LookupEvents covers management events only and can lag by several minutes.
      parameters:
        - { name: agent_id, in: path, required: true, schema: { type: string } }
        - { name: since, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: The agent's current and previous AWS key with their IAM status, and their events oldest first
          content:
            application/json:
              schema:
                type: object
                required: [keys, events]
                properties:
                  keys:
                    type: array
                    description: AWSPREVIOUS (if any) then AWSCURRENT, with status as IAM reports it (never inferred from events)
                    items:
                      type: object
                      properties:
                        key_ref: { type: string, example: 'burn/agent-reader/aws_key#v2' }
                        key_hint: { type: string, description: last 4 characters of the access key id }
                        status: { type: string, enum: [active, inactive] }
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        ts: { type: string, format: date-time }
                        key_ref: { type: string, example: 'burn/agent-reader/aws_key#v2', description: 'secret_ref plus credential version' }
                        key_hint: { type: string, description: last 4 characters of the access key id }
                        event_name: { type: string, example: GetCallerIdentity }
                        event_source: { type: string, example: sts.amazonaws.com }
                        resource: { type: string, nullable: true }
                        source_ip: { type: string, nullable: true }
                        error_code: { type: string, nullable: true }
  /sessions/{session_id}/canary:
    post:
      summary: Issue the session's canary. Idempotent per session - a retry returns the same canary.
      description: |
        One decoy credential per session (the session id is the instance's identity). It looks like a mock-provider api_key
        (`mpk_live_` + 32 chars) but never authenticates. The value goes only to Secrets Manager at
        `canary_ref` (= names.canary_secret_ref(agent_id, session_id)); this route returns metadata only.
        Called by session/instance creation right after the session id is known.
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{1,128}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id]
              properties:
                agent_id: { type: string, example: agent-worker-3fa91c }
      responses:
        '200':
          description: The session's canary (reference only, never the value)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Canary' }
    get:
      summary: Metadata of the session's canary (never the value). 404 if none was issued.
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: string } }
        - { name: agent_id, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: The session's canary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Canary' }
  /agents/{agent_id}/canaries:
    delete:
      summary: Delete every canary of the agent (demo reset only). Burns and session exits keep canaries so they stay attributable.
      parameters:
        - { name: agent_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: array, items: { type: string } }
  /flags:
    post:
      summary: Raise the review level of registered credentials (seen < attempted < reported). Never lowers it; idempotent.
      description: |
        For shared / other-owner credentials. Flagging never rotates anything. Each level keeps the first
        evidence that reached it. Which sources may claim which level:
        seen = tool_response, handoff, burn; attempted = egress, gateway, handoff (a blocked send);
        reported = provider (presented at a monitored service), and only for a credential that is
        already flagged: shared keys are presented by their legitimate users all the time.
        Canaries are never flagged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret_refs, level, evidence]
              properties:
                secret_refs: { type: array, maxItems: 100, items: { type: string } }
                level: { $ref: '#/components/schemas/FlagLevel' }
                evidence: { $ref: '#/components/schemas/FlagEvidence' }
      responses:
        '200':
          description: Level of each registered secret_ref after the call (unregistered refs and canaries are left out)
          content:
            application/json:
              schema:
                type: object
                required: [flags]
                properties:
                  flags:
                    type: array
                    items:
                      type: object
                      required: [secret_ref, flag_level, changed]
                      properties:
                        secret_ref: { type: string }
                        flag_level: { $ref: '#/components/schemas/FlagLevel' }
                        changed: { type: boolean, description: true if this call raised the level }
  /shared/credentials:
    post:
      summary: Issue a shared credential (used by several agents). Idempotent by name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type, template]
              properties:
                name: { type: string, pattern: '^[a-z0-9_]{1,40}$', example: crm_db_url }
                type: { type: string, enum: [other, api_key] }
                template:
                  type: string
                  description: 'Value template from the scenario file. {random} is replaced with 24 random [A-Za-z0-9] chars.'
                  example: 'postgres://svc_crm:{random}@crm-db.internal.example:5432/crm'
      responses:
        '200':
          description: Shared credential reference
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret_ref: { type: string, example: burn/shared/crm_db_url }
                  version: { type: integer }
    delete:
      summary: Delete all shared credentials (demo reset / teardown).
      responses:
        '200': { description: Deleted }
components:
  schemas:
    FlagLevel:
      type: string
      enum: [seen, attempted, reported]
    FlagEvidence:
      type: object
      description: Safe metadata only. Never a credential value, URL query string or request body.
      required: [source]
      additionalProperties: false
      properties:
        source: { type: string, enum: [tool_response, egress, handoff, burn, gateway, provider] }
        event_id: { type: string, pattern: '^evt_[0-9A-HJKMNP-TV-Z]{26}$' }
        agent_id: { type: string, pattern: '^(agent-[a-z0-9-]{1,40}|system)$' }
        session_id: { type: string, pattern: '^[A-Za-z0-9_.:-]{1,128}$' }
        tool: { type: string, pattern: '^[A-Za-z0-9_.-]{1,64}$' }
        ts: { type: string, format: date-time }
        fingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
    Canary:
      type: object
      required: [canary_ref, agent_id, session_id, version, status, issued_at]
      properties:
        canary_ref: { type: string, example: burn/agent-worker-3fa91c/canary_0f1e2d3c4b5a69788796a5b4 }
        agent_id: { type: string, example: agent-worker-3fa91c }
        session_id: { type: string }
        version: { type: integer, description: always 1; canaries are never rotated }
        status: { type: string, enum: [issuing, active, tripped] }
        issued_at: { type: string, format: date-time }
