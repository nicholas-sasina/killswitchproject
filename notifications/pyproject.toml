[project]
name = "burn-notifications"
version = "0.1.0"
description = "BURN notifications: classify ledger events and deliver them to private Slack, Telegram, Discord, Teams and SES destinations."
requires-python = ">=3.11"
dependencies = ["boto3"]

[dependency-groups]
dev = ["pytest", "moto[dynamodb,sqs,ses,sesv2,secretsmanager,iam]>=5", "burn-contracts", "jsonschema", "trustme"]
infra = ["aws-cdk-lib>=2.220.0", "constructs>=10.0.0"]

[tool.uv]
package = false

[tool.uv.sources]
burn-contracts = { path = "../contracts", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["live: sends real messages to authorized test channels (opt-in, BURN_NOTIFY_LIVE=1)"]
addopts = "-m 'not live'"
