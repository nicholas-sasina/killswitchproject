[project]
name = "burn-gateway"
version = "1.0.0"
description = "Burn's AgentCore Gateway code: interceptor, mock tools, badge helper."
requires-python = ">=3.12"
dependencies = [
  "boto3",
  "burn-contracts",
]

[dependency-groups]
dev = [
  "pytest",
  "moto[dynamodb,secretsmanager,cognitoidp,ssm]>=5",
]

[tool.uv]
package = false

[tool.uv.sources]
burn-contracts = { path = "../contracts", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
# Each Lambda folder is its own top-level package at runtime, so tests import
# them the same way. badges.py is imported from this folder, and the shared
# burn_detect library from ../detection (bundled into the Lambda at deploy).
pythonpath = [".", "lambdas/interceptor", "lambdas/tools", "../detection"]
