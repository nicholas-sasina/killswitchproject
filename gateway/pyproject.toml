[project]
name = "burn-gateway"
version = "1.0.0"
description = "Burn's AgentCore Gateway code: interceptor, mock tools, badge helper."
requires-python = ">=3.12"
dependencies = [
  "boto3",
  "burn-contracts",
]

[dependency-groups]
dev = [
  "pytest",
  "moto[dynamodb,secretsmanager,cognitoidp,ssm]>=5",
]

[tool.uv]
package = false

[tool.uv.sources]
burn-contracts = { path = "../contracts", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # badges.py is imported as a top-level module, as in the Burn API Lambda
