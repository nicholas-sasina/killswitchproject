[project]
name = "burn-api"
version = "1.0.0"
description = "Burn API: HTTP API + Lambda for sessions, burn, blast radius and the dashboard feed."
requires-python = ">=3.11"
dependencies = ["boto3"]

[dependency-groups]
dev = ["pytest", "moto[dynamodb,secretsmanager,ssm]>=5", "burn-contracts"]

[tool.uv]
package = false

[tool.uv.sources]
burn-contracts = { path = "../contracts", editable = true }

[tool.pytest.ini_options]
pythonpath = ["lambdas/api", "tests"]
testpaths = ["tests"]
